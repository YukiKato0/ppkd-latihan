<body>

  <script>
    let berat = 10
    let kota = "Bogor";
    let hasil;

    switch (kota) {
      case "Bogor":
        hasil = 4000 * berat;
        break;
      case "Depok":
        hasil = 2000 * berat;
        break;
      default:
        hasil = 6000 * berat;
    }

    console.log(hasil);
  </script>

</body>
