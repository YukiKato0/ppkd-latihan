<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            color: white;
            background-color: rgb(41, 41, 41);
        }
        .li {
            width: 80%;
            margin: auto;
            display: flex;
            justify-content: space-between;
        }
        
    </style>
</head>
<body>
    <div class="li">
        <div class="ulType">
            <ul type="none">
                <li>Test</li>
                <li>Test</li>
                <li>Test</li>
            </ul>
            <ul>
                <li>Test</li>
                <li>Test</li>
                <li>Test</li>
            </ul>
            <ul type="square">
                <li>Test</li>
                <li>Test</li>
                <li>Test</li>
            </ul>
        </div>

        <div class="olType">
            <ol>
                <li>Ol Test</li>
                <li>Ol Test</li>
                <li>Ol Test</li>
            </ol>
            
        </div>
    </div>
</body>
</html>
